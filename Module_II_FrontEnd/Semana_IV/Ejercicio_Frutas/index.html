<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <header>
    <nav class="navbar contain">
      <div class="nav-main">
        <button class="nav-brand">
          <img src="imgs/logo.png" alt="logo" class="brand-image" />
        </button>
        <button class="nav-button">Home</button>
        <button class="nav-button">Frutas</button>
        <button class="nav-button">Verduras</button>
        <button class="nav-button">Ofertas</button>
        <button class="nav-button">Ordenar</button>
      </div>
      <div>
        <form action="resultados.html" method="GET">
          <input class="search-input" type="search" name="q" placeholder="Buscar..."aria-label="Buscar en el sitio"/>
        </form>
      </div>
    </nav>
  </header>

  <body>
    <section>
      <div class="poster contain">
        <div class="poster-content">
          <div>
            <p class="main-text">El mejor mango de Costa Rica para sus antojos</p>
            <p class="sup-text">Mango Verde y Maduro</p>
            <br>
            <p class="price-text">$4 por Kilo</p>
          </div>
          <button class="shop-button">Comprar Ya</button>
        </div>
        <div><img src="imgs/mangos.png" alt="model" class="poster-image" /></div>
      </div>
    </section>
    <main class="catalog contain">
      <div>
        <div class="title-container">
          <p class="main-title">Trending</p>
          <p class="sub-title">Most Trendy Clothes</p>
        </div>
      </div>
      <div class="product-rows">
        <div class="product">
          <div>
            <img
              src="imgs/giant-ducky.jpg"
              alt="giant-ducky"
              class="product-image"
            />
          </div>
          <div class="product-info">
            <div class="main-row">
              <span class="info-name">Giant Ducky</span>
              <button class="add-button">+</button>
            </div>
            <span>Duckies</span>
            <span class="price">$475</span>
          </div>
        </div>
        <div class="product">
          <div>
            <img
              src="imgs/3-duckies.png"
              alt="3-duckies"
              class="product-image"
            />
          </div>
          <div class="product-info">
            <div class="main-row">
              <span class="info-name">3 Duckies</span>
              <button class="add-button">+</button>
            </div>
            <span>Duckies</span>
            <span class="price">$475</span>
          </div>
        </div>
        <div class="product">
          <div>
            <img
              src="imgs/bat-ducky.jpg"
              alt="bat-ducky"
              class="product-image"
            />
          </div>
          <div class="product-info">
            <div class="main-row">
              <span class="info-name">Bat Ducky</span>
              <button class="add-button">+</button>
            </div>
            <span>Duckies</span>
            <span class="price">$475</span>
          </div>
        </div>
        <div class="product">
          <div>
            <img
              src="imgs/cool-ducky.jpg"
              alt="cool-ducky"
              class="product-image"
            />
          </div>
          <div class="product-info">
            <div class="main-row">
              <span class="info-name">Cool Ducky</span>
              <button class="add-button">+</button>
            </div>
            <span>Duckies</span>
            <span class="price">$475</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
